name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DJANGO_SETTINGS_MODULE: config.settings.dev
  # 50+ chars, not the django-insecure- prefix — long enough that check
  # --deploy's W009 (weak SECRET_KEY) doesn't fire on CI's own placeholder
  # and mask a real warning underneath it. Still just a CI placeholder,
  # never used outside this workflow.
  DJANGO_SECRET_KEY: ci-test-secret-key-that-is-long-enough-to-satisfy-w009-check-1234567890
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  DATABASE_URL: postgres://site_backend:site_backend@localhost:5432/site_backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: site_backend
          POSTGRES_USER: site_backend
          POSTGRES_PASSWORD: site_backend
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U site_backend"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Django check
        run: python manage.py check

      - name: Django check --deploy (prod settings)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          AWS_STORAGE_BUCKET_NAME: ci-placeholder
          AWS_S3_REGION_NAME: ci-placeholder
          AWS_ACCESS_KEY_ID: ci-placeholder
          AWS_SECRET_ACCESS_KEY: ci-placeholder
          # prod.py has no default for this — without it, settings fail to
          # import at all under DJANGO_SETTINGS_MODULE=prod, so this step
          # would fail before check --deploy ever ran a single check.
          EMAIL_HOST: ci-placeholder.example.com
        run: python manage.py check --deploy

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: site-rebuild:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Only after test+build both pass, and only for a real push to main — never
  # for a PR (a fork's PR wouldn't have these secrets anyway, and this must
  # never run against untrusted PR code regardless).
  #
  # Pushes to GitHub Container Registry using the workflow's own GITHUB_TOKEN
  # (no extra registry secrets to provision) — deploy.sh on the EC2 instance
  # doesn't actually pull this image; it does its own `git pull` + local
  # `docker compose build` from the exact commit this job just built and
  # tested, so the two are always in lockstep without the EC2 box needing
  # registry pull credentials at all. The pushed image still matters: it's
  # what proves the Dockerfile builds clean before deploy.sh ever runs, and
  # it's there as a pinned rollback artifact if a deploy needs to be undone
  # by hand (`docker pull ghcr.io/<owner>/<repo>:<sha>`).
  deploy:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Requires three repo secrets, set under Settings -> Secrets and
      # variables -> Actions: EC2_HOST (the instance's address), EC2_USER
      # (the `deploy` user created by deploy/setup.sh), and EC2_SSH_KEY (the
      # deploy user's private key — its matching public key must already be
      # in that user's ~/.ssh/authorized_keys on the instance, see setup.sh).
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: /opt/neuroml/app/deploy/deploy.sh
