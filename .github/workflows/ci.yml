name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DJANGO_SECRET_KEY: ci-test-secret-key
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  DATABASE_URL: postgres://site_backend:site_backend@localhost:5432/site_backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: site_backend
          POSTGRES_USER: site_backend
          POSTGRES_PASSWORD: site_backend
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U site_backend"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Django check
        run: python manage.py check

      - name: Django check --deploy (prod settings)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          AWS_STORAGE_BUCKET_NAME: ci-placeholder
          AWS_S3_ENDPOINT_URL: https://ci-placeholder.example.com
          AWS_S3_REGION_NAME: ci-placeholder
          AWS_ACCESS_KEY_ID: ci-placeholder
          AWS_SECRET_ACCESS_KEY: ci-placeholder
        run: python manage.py check --deploy

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: site-rebuild:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
