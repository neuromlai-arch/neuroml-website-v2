services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: site_backend
      POSTGRES_USER: site_backend
      POSTGRES_PASSWORD: site_backend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U site_backend"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
