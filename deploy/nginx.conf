# neuroml.ai — host nginx, reverse-proxying to gunicorn in the `web`
# container (deploy/docker-compose.prod.yml binds it to 127.0.0.1:8000).
#
# This file is HTTP-only on purpose. Certbot's nginx plugin adds the actual
# `listen 443 ssl` server block(s) and certificate paths itself when you run:
#   sudo certbot --nginx -d neuroml.ai -d www.neuroml.ai
# (see DEPLOY.md's SSL section) — it also converts the redirect below to an
# HTTPS one, since it defaults to redirecting all HTTP to HTTPS after issuing
# a cert. Don't hand-write `ssl_certificate` paths here before that's run;
# the files won't exist yet and nginx will refuse to (re)start.
#
# Install location on the server: /etc/nginx/sites-available/neuroml.conf,
# symlinked into sites-enabled only once the new site is verified working on
# :8000 — see DEPLOY.md's cutover checklist. deploy/setup.sh stages this file
# but deliberately does not enable it.

# www -> apex (non-www), before anything else runs. $scheme keeps this
# correct whether it's still plain HTTP or (after certbot) HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name www.neuroml.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 $scheme://neuroml.ai$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name neuroml.ai;

    # Certbot's HTTP-01 challenge needs a real, always-reachable path —
    # served here rather than proxied to gunicorn so it still works even if
    # the app container is down.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 20m;  # gated file downloads / resume uploads

    # Same headers Django's SecurityMiddleware already sets on every
    # response that goes through it (see config/settings/prod.py /
    # config/settings/base.py) — duplicated here so they're also present on
    # anything nginx answers *without* going through Django: static files
    # below, and any 5xx nginx serves itself if gunicorn is unreachable.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # HSTS: Django already sends this on proxied responses per
    # SECURE_HSTS_SECONDS, but static files below never reach Django, so it
    # has to be set here too to actually cover the whole origin.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip only text-ish/compressible types; images other than svg are
    # already compressed formats and gzip does more harm (CPU) than good.
    # text/html isn't listed in gzip_types: nginx always compresses it once
    # `gzip on` is set, and listing it explicitly just produces a harmless
    # "duplicate MIME type" warning at startup.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml;

    # Collected by `python manage.py collectstatic`, bind-mounted from the
    # web container into this same host path — see docker-compose.prod.yml.
    # Whitenoise still serves these if nginx is bypassed somehow, but
    # serving them here means gunicorn never sees a static-file request.
    location /static/ {
        alias /opt/neuroml/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Required: SECURE_PROXY_SSL_HEADER in config/settings/prod.py
        # trusts this header to decide whether the original request was
        # HTTPS. Get this wrong and Django's SECURE_SSL_REDIRECT loops
        # forever, redirecting every request back to itself.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
