{% comment %}Usage: {% include "components/_field_error.html" with field=form.email %}{% endcomment %}
{% for error in field.errors %}
  <p class="form-error mt-1.5" role="alert">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true" class="shrink-0 text-error">
      <circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.3"/>
      <path d="M7 4v3.5M7 9.5h.01" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
    <span>{{ error }}</span>
  </p>
{% endfor %}
